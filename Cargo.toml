[workspace]
resolver = "3"
members = ["sources/en.hniscantrad"]

[workspace.package]
authors = ["local"]
edition = "2024"
rust-version = "1.88"
license = "MIT"
homepage = "https://hni-scantrad.net/"
repository = "https://example.invalid/hni-rakuyomi-source"
keywords = ["aidoku", "rakuyomi", "manga"]
categories = ["multimedia", "no-std", "parsing", "wasm"]

[workspace.dependencies]
aidoku = { git = "https://github.com/Aidoku/aidoku-rs.git", features = ["json"] }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "s"
strip = true
lto = true
