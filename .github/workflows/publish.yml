name: Build and publish HNI source

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust WASM target
        run: rustup target add wasm32-unknown-unknown

      - name: Install current Aidoku CLI
        run: cargo install --git https://github.com/Aidoku/aidoku-rs aidoku-cli

      - name: Build HNI source
        working-directory: sources/en.hniscantrad
        run: aidoku package .

      - name: Verify HNI source
        working-directory: sources/en.hniscantrad
        run: aidoku verify package.aix

      - name: Prepare source list
        run: |
          mkdir -p public

          cp sources/en.hniscantrad/package.aix \
             public/en.hniscantrad-v2.aix

          cp sources/en.hniscantrad/res/icon.png \
             public/en.hniscantrad-v2.png

          cat > public/index.min.json <<'EOF'
          [{"id":"en.hniscantrad","name":"HNI-Scantrad","file":"en.hniscantrad-v2.aix","icon":"en.hniscantrad-v2.png","lang":"en","version":2,"nsfw":0}]
          EOF

          cat > public/index.html <<'EOF'
          <!doctype html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>HNI Rakuyomi Source</title>
          </head>
          <body>
            <h1>HNI-Scantrad Rakuyomi Source</h1>
            <p><a href="index.min.json">index.min.json</a></p>
          </body>
          </html>
          EOF

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

