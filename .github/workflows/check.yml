name: Check source
on:
  workflow_dispatch:
  push:
    paths:
      - 'sources/**'
      - 'Cargo.toml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo check --target wasm32-unknown-unknown -p hniscantrad
